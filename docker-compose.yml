# ── Outcome — self-hosted deployment ─────────────────────────────────────────
# Runs a complete Outcome instance from the prebuilt images on Docker Hub.
#
#   cp .env.example .env        # then fill EVERY value (the file explains each one)
#   docker compose up -d
#
# Edge TLS via caddy-docker-proxy: the Caddyfile is GENERATED from container labels —
# each service declares its own routing. Auto Let's Encrypt for every host in the labels.
# Edge → frontend (nginx routes /api + /livekit to the API) → API (N replicas) →
# Postgres (via PgBouncer) / Redis / Garage (S3 storage) / LiveKit. Data services are NOT published
# on the host; only Caddy (80/443) and the LiveKit media ports are.
name: outcome

x-logging: &logging
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "2" }

services:
  caddy:
    # caddy-docker-proxy: watches the Docker socket and builds the Caddyfile from the
    # `caddy.*` labels of running containers. No config file to maintain.
    image: lucaslorentz/caddy-docker-proxy:2.10-alpine
    restart: unless-stopped
    <<: *logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - caddy_data:/data
      - caddy_config:/config
    labels:
      # Site-less labels on the proxy container become GLOBAL Caddyfile options.
      caddy.email: ${ACME_EMAIL}
    depends_on: [frontend]

  frontend:
    image: skayloo/outcome-frontend:${OUTCOME_TAG:-latest}
    restart: unless-stopped
    <<: *logging
    environment:
      # Behind Caddy the frontend stays plain HTTP — the edge terminates TLS with a
      # real cert. (Leave TLS_SAN empty; secure context comes from the browser's https URL.)
      TLS_SAN: ""
    labels:
      # The edge site. nginx inside this container fans /api + /livekit + /uploads
      # out to the API replicas.
      caddy: ${OUTCOME_DOMAIN}, www.${OUTCOME_DOMAIN}
      caddy.encode: zstd gzip
      # The API takes uploads up to 100 MB, and call recordings arrive in 16 MB parts;
      # 12 MB here refused both with a 413 before they reached it. Same as the reference.
      caddy.request_body.max_size: 110MB
      caddy.reverse_proxy: "{{upstreams 80}}"
    depends_on: [server]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128M }

  server:
    image: skayloo/outcome-server:${OUTCOME_TAG:-latest}
    restart: unless-stopped
    <<: *logging
    environment:
      ASPNETCORE_URLS: "http://0.0.0.0:5000"
      # Runtime queries ride PgBouncer (transaction pooling). "No Reset On Close" skips Npgsql's
      # DISCARD ALL on connection return — required with a transaction pooler; the pooler does
      # its own reset. Pool size is per REPLICA; PgBouncer squeezes them all onto ~20 backends.
      ConnectionStrings__Postgres: "Host=pgbouncer;Port=5432;Database=outcome;Username=outcome;Password=${POSTGRES_PASSWORD};No Reset On Close=true;Maximum Pool Size=100"
      # Migrations go STRAIGHT to Postgres — they hold a session advisory lock, which
      # transaction pooling would silently break.
      ConnectionStrings__PostgresDirect: "Host=postgres;Port=5432;Database=outcome;Username=outcome;Password=${POSTGRES_PASSWORD}"
      OUTCOME_Redis__Url: "redis:6379"
      OUTCOME_Server__Name: "${SERVER_NAME}"
      # The browser-facing address of this instance.
      OUTCOME_Server__PublicOrigin: "https://${OUTCOME_DOMAIN}"
      # Requests reach the API through Caddy and nginx inside Docker's private ranges; only
      # those may tell it the visitor's real address (X-Forwarded-For). Without this every
      # visitor looks like nginx, and every per-address limit — sign-ups, sign-ins, guest
      # joins — becomes one shared bucket for the whole instance.
      OUTCOME_Server__TrustedProxies__0: "127.0.0.1/32"
      OUTCOME_Server__TrustedProxies__1: "::1/128"
      OUTCOME_Server__TrustedProxies__2: "172.16.0.0/12"
      OUTCOME_JwtAuth__JwtKey: "${JWT_KEY}"
      # File storage: Garage, over S3 (the settings keep MinIO's name — any S3 store fits).
      OUTCOME_Minio__Endpoint: "garage:3900"
      OUTCOME_Minio__AccessKey: "${GARAGE_ACCESS_KEY}"
      OUTCOME_Minio__SecretKey: "${GARAGE_SECRET_KEY}"
      OUTCOME_Minio__Bucket: "${MINIO_BUCKET}"
      OUTCOME_Minio__UseSsl: "false"
      OUTCOME_Voice__LiveKitApiKey: "${LIVEKIT_API_KEY}"
      OUTCOME_Voice__LiveKitApiSecret: "${LIVEKIT_API_SECRET}"
      # Browser-facing signaling URL (rides the same-origin /livekit proxy through Caddy).
      OUTCOME_Voice__LiveKitUrl: "wss://${OUTCOME_DOMAIN}/livekit"
      OUTCOME_Voice__LiveKitInternalUrl: "ws://livekit:7880"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    depends_on:
      postgres: { condition: service_healthy }
      pgbouncer: { condition: service_healthy }
      redis: { condition: service_healthy }
      garage: { condition: service_healthy }
    deploy:
      replicas: ${SERVER_REPLICAS:-2}
      resources:
        limits: { cpus: "1.0", memory: 512M }

  pgbouncer:
    # Transaction-mode pooler between the API replicas and Postgres. Npgsql pools client-side
    # per replica, so N replicas × pool max can blow past Postgres' max_connections; PgBouncer
    # multiplexes them onto a small steady set of server connections.
    image: edoburu/pgbouncer:v1.24.1-p1
    restart: unless-stopped
    <<: *logging
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: outcome
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: outcome
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: 20        # server connections per db — plenty for chat's query mix
      MAX_CLIENT_CONN: 500
      # Npgsql uses protocol-level prepared statements; 1.21+ tracks them across pooled sessions.
      MAX_PREPARED_STATEMENTS: 200
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=$${DB_PASSWORD} psql -h 127.0.0.1 -p 5432 -U outcome -d outcome -c 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      postgres: { condition: service_healthy }

  postgres:
    image: postgres:16
    restart: unless-stopped
    <<: *logging
    environment:
      POSTGRES_DB: outcome
      POSTGRES_USER: outcome
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outcome -d outcome"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    restart: unless-stopped
    <<: *logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # File storage (uploads, avatars, call recordings) — Garage, an S3 server. It sets itself up:
  # --single-node lays out a one-machine cluster, --default-bucket makes the access key and the
  # bucket from the variables below. The key id is "GK" + 24 hex characters and the secret 64 hex
  # (.env.example has the commands) — Garage refuses other shapes.
  garage:
    image: dxflrs/garage:v2.4.1
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    restart: unless-stopped
    <<: *logging
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_ACCESS_KEY}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_SECRET_KEY}
      GARAGE_DEFAULT_BUCKET: ${MINIO_BUCKET}
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Upgrading from 1.31.78 or earlier (files in MinIO) — README, "Upgrading from MinIO". ────
  # MinIO stopped publishing its images; an install that has run it still has the image and the
  # `minio_data` volume. These two run only with `--profile migrate`: the old MinIO, and a
  # one-time copy of every file into Garage (it never deletes anything; running it twice is fine).
  minio:
    profiles: ["migrate"]
    image: quay.io/minio/minio:latest
    # It cannot be downloaded any more — only the copy already on this machine is used.
    pull_policy: never
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-}
    volumes:
      - minio_data:/data

  storage-migrate:
    profiles: ["migrate"]
    image: rclone/rclone:1.68.2
    # An install that never stored a file has no bucket in MinIO — then there is nothing to copy.
    # Wrong keys still fail: listing the buckets needs them.
    entrypoint: ["sh", "-c"]
    command:
      - >-
        rclone lsd old: > /tmp/buckets &&
        if grep -q " ${MINIO_BUCKET}$$" /tmp/buckets;
        then rclone copy "old:${MINIO_BUCKET}" "new:${MINIO_BUCKET}" --s3-no-check-bucket -v --stats-one-line;
        else echo "MinIO holds no ${MINIO_BUCKET} bucket: nothing was ever stored, nothing to copy";
        fi
    environment:
      RCLONE_CONFIG_OLD_TYPE: s3
      RCLONE_CONFIG_OLD_PROVIDER: Minio
      RCLONE_CONFIG_OLD_ENDPOINT: http://minio:9000
      RCLONE_CONFIG_OLD_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-}
      RCLONE_CONFIG_OLD_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-}
      RCLONE_CONFIG_NEW_TYPE: s3
      RCLONE_CONFIG_NEW_PROVIDER: Other
      RCLONE_CONFIG_NEW_ENDPOINT: http://garage:3900
      RCLONE_CONFIG_NEW_REGION: us-east-1
      RCLONE_CONFIG_NEW_ACCESS_KEY_ID: ${GARAGE_ACCESS_KEY}
      RCLONE_CONFIG_NEW_SECRET_ACCESS_KEY: ${GARAGE_SECRET_KEY}
    depends_on:
      minio: { condition: service_started }
      garage: { condition: service_healthy }

  livekit:
    image: livekit/livekit-server:latest
    # A wrapper around livekit-server: it enables the TURN relay only when Caddy has actually
    # issued the certificate for turn.<domain>. livekit-server EXITS outright when turn is on
    # and the file is missing, which is the normal state before DNS is pointed — and losing
    # voice entirely in order to add a fallback to it is the wrong way round.
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    # --node-ip advertises the host's PUBLIC IP for media (ICE); media bypasses Caddy.
    command: ["--node-ip", "${LIVEKIT_NODE_IP}"]
    volumes:
      - ./livekit-entrypoint.sh:/entrypoint.sh:ro
      - caddy_data:/caddy:ro
    labels:
      # This serves nothing useful. Its only job is to make Caddy get a certificate for the
      # TURN host; the relay does not speak HTTP and never goes through Caddy.
      caddy: turn.${OUTCOME_DOMAIN}
      caddy.respond: "204"
    restart: unless-stopped
    <<: *logging
    environment:
      # LiveKit reads keys from LIVEKIT_KEYS ("key: secret"), kept out of the config file.
      # The entrypoint builds turn.<domain> from this to find Caddy's certificate.
      OUTCOME_DOMAIN: "${OUTCOME_DOMAIN}"
      TURN_TLS_PORT: "${TURN_TLS_PORT:-5349}"
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
      # Full config INLINE because the webhook section must name the signing key id,
      # which lives in env — Compose interpolates it here; a static file can't.
      LIVEKIT_CONFIG: |
        port: 7880
        bind_addresses:
          - 0.0.0.0
        redis:
          address: redis:6379
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: false
        # Webhooks feed the API's guest-presence registry: guests join LiveKit directly,
        # so these events are how members NOT in the room learn a guest exists.
        webhook:
          api_key: ${LIVEKIT_API_KEY}
          urls:
            - http://server:5000/api/v1/livekit/webhook
    ports:
      # 7880 (signal) stays internal — the API proxies it. Media MUST be host-reachable:
      - "7881:7881"                          # ICE/TCP fallback
      # TURN over TLS. For anyone whose network mangles UDP — a corporate firewall, a phone
      # on a bad carrier, a VPN that proxies TCP well and UDP badly — media arrives here
      # instead, looking like an ordinary TLS connection.
      - "${TURN_TLS_PORT:-5349}:${TURN_TLS_PORT:-5349}"
      - "7882:7882/udp"                      # ICE/UDP — single muxed port, all participants
    depends_on:
      redis: { condition: service_healthy }

volumes:
  pgdata:
  garage_meta:
  garage_data:
  # Only for the upgrade from MinIO; remove it once the files are in Garage (README).
  minio_data:
  caddy_data:
  caddy_config:
